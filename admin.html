<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão | Ibernop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1c2321; --charcoal: #07202e; --charcoal-2: #0d3346;
  --gold: #1b86f1; --gold-dark: #0f5fb0;
  --gray: #5c6b64; --gray-light: #8a978f;
  --bg: #ffffff; --bg-alt: #f3f5f7; --border: #e2e6ea;
  --green-soft: #eaf3fd; --red: #b23b3b;
  --radius: 12px; --radius-pill: 999px;
  --font: "Montserrat", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg-alt); }
.wrap { max-width: 1000px; margin: 0 auto; padding: 24px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; border: 1.5px solid var(--border); background: #fff; cursor: pointer; color: var(--charcoal); }
.btn.primary { background: var(--gold); color: #fff; border-color: var(--gold); }
.btn.danger { color: var(--red); }
input, select, textarea { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 0.9rem; }

/* ---------- Login ---------- */
#loginBox { max-width: 400px; margin: 80px auto; background: #fff; border-radius: var(--radius); padding: 32px; box-shadow: 0 2px 20px rgba(0,0,0,0.08); }
#loginBox h2 { margin-top: 0; }
#loginBox input { width: 100%; margin-bottom: 12px; }
.admin-error { display: none; background: #fbe9e9; color: var(--red); padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 12px; }
.admin-error.show { display: block; }

/* ---------- App ---------- */
#app { display: none; }
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.topbar h1 { font-size: 1.3rem; margin: 0; }
.tabs { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
.tabs button { padding: 10px 18px; border-radius: 8px; border: 1.5px solid var(--border); background: #fff; font-weight: 700; cursor: pointer; color: var(--gray); font-size: 0.88rem; }
.tabs button.active { background: var(--charcoal); color: #fff; border-color: var(--charcoal); }

.entry-card { background: #fff; border-radius: var(--radius); padding: 18px 20px; margin-bottom: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
.entry-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.entry-title { font-weight: 800; font-size: 1.02rem; }
.entry-sub { color: var(--gray); font-size: 0.86rem; margin-top: 2px; }
.badge { display: inline-block; padding: 4px 10px; border-radius: var(--radius-pill); font-size: 0.72rem; font-weight: 800; text-transform: uppercase; }
.badge.pendente { background: #fef3e0; color: #b8720a; }
.badge.aprovado { background: var(--green-soft); color: var(--gold-dark); }
.badge.separado { background: #e3ecfa; color: #2255a4; }
.badge.enviado { background: var(--green-soft); color: #237a4b; }
.entry-actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.itens-list { margin-top: 10px; font-size: 0.86rem; color: var(--gray); }
.empty-state { text-align: center; color: var(--gray-light); padding: 50px 20px; }

/* ---------- Lista de separação (modal + impressão) ---------- */
#separacaoBackdrop { display: none; position: fixed; inset: 0; background: rgba(20,25,23,0.6); z-index: 90; }
#separacaoModal { display: none; position: fixed; inset: 0; z-index: 91; overflow-y: auto; padding: 30px 16px; }
#separacaoBackdrop.open, #separacaoModal.open { display: block; }
#separacaoConteudo { max-width: 720px; margin: 0 auto; background: #fff; border-radius: var(--radius); padding: 36px 40px; }
.separacao-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; border-bottom: 3px solid var(--charcoal); padding-bottom: 18px; margin-bottom: 24px; }
.separacao-titulo { font-size: 1.6rem; font-weight: 800; }
.separacao-sub { font-size: 1.1rem; color: var(--gray); margin-top: 4px; }
.separacao-header-actions { display: flex; gap: 8px; }
.separacao-item {
  display: flex; align-items: center; gap: 18px;
  padding: 16px 4px; border-bottom: 1px solid var(--border);
  font-size: 1.15rem;
}
.separacao-item input[type="checkbox"] { width: 26px; height: 26px; flex-shrink: 0; accent-color: var(--charcoal); }
.separacao-item .separacao-qty {
  background: var(--charcoal); color: #fff; font-weight: 800; font-size: 1.2rem;
  min-width: 52px; text-align: center; padding: 6px 10px; border-radius: 8px; flex-shrink: 0;
}
.separacao-item .separacao-nome { font-weight: 700; }
.separacao-item .separacao-tamanho { color: var(--gray); font-weight: 600; }
.separacao-item.riscado { opacity: 0.4; text-decoration: line-through; }

@media print {
  body * { visibility: hidden; }
  #separacaoModal, #separacaoModal * { visibility: visible; }
  #separacaoModal { position: absolute; top: 0; left: 0; padding: 0; }
  #separacaoConteudo { box-shadow: none; max-width: 100%; }
  .separacao-header-actions { display: none; }
  #separacaoBackdrop { display: none !important; }
}
.form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px; }
.form-grid input, .form-grid select { width:100%; }
.montra-box { display:flex; gap:14px; flex-wrap:wrap; align-items:flex-start; margin-top:12px; padding-top:12px; border-top:1px dashed #ddd; }
.montra-foto { width:140px; height:105px; border-radius:10px; background:#f1f1ee; overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:0.8rem; color:#888; }
.montra-foto img { width:100%; height:100%; object-fit:cover; }
.btn { border-radius: 32px; }
h1, h2, .entry-title { letter-spacing: .01em; }
.tabs button { border-radius: 32px !important; }
</style>
</head>
<body>

<div id="loginBox">
  <h2>Gestão Ibernop</h2>
  <p style="color:var(--gray); font-size:0.88rem;">Acesso restrito à equipa Ibernop.</p>
  <div class="admin-error" id="loginError"></div>

<div id="app">

    <div class="topbar">
      <h1 style="display:flex;align-items:center;gap:14px"><span style="background:var(--charcoal);border-radius:12px;padding:6px 10px;display:inline-flex"><img src="https://media.swipepages.com/2023/4/621f886f96edea001153d2aa/logo_white.png" alt="" style="height:38px"></span>GESTÃO IBERNOP</h1>

</div>

<div id="separacaoBackdrop" onclick="fecharListaSeparacao()"></div>
<div id="separacaoModal">
  <div id="separacaoConteudo">
    <div class="separacao-header">
      <div>

</div>

<script src="produtos-data.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyBAlMWFnh8JM4sVuWjEJhde88AbmNhfv7k",
  authDomain: "ibernop-7a0d6.firebaseapp.com",
  projectId: "ibernop-7a0d6",
  storageBucket: "ibernop-7a0d6.firebasestorage.app",

// Sessão própria para a gestão (app com nome diferente), para não interferir com o login da área de cliente no mesmo navegador
const appGestao = firebase.initializeApp(firebaseConfig, 'gestao');
const auth = appGestao.auth();
const db = appGestao.firestore();

const ADMIN_EMAILS = ["ibernop@outlook.com"];

function doLogin() {
  const email = document.getElementById('adminEmail').value.trim();
  const password = document.getElementById('adminPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.classList.remove('show');
  auth.signInWithEmailAndPassword(email, password).catch(err => {
    errEl.textContent = 'E-mail ou palavra-passe incorretos.';
    errEl.classList.add('show');
  });
}
function doLogout() { auth.signOut(); }

auth.onAuthStateChanged(user => {
  const isAdmin = user && ADMIN_EMAILS.includes(user.email);
  document.getElementById('loginBox').style.display = isAdmin ? 'none' : 'block';
  document.getElementById('app').style.display = isAdmin ? 'block' : 'none';
  if (isAdmin) {
    loadClientes();
  } else if (user && !isAdmin) {
    document.getElementById('loginError').textContent = 'Esta conta não tem acesso à gestão.';
    document.getElementById('loginError').classList.add('show');
    auth.signOut();
  }
});

function setTab(tab) {
  document.getElementById('tabClientes').classList.toggle('active', tab === 'clientes');
  document.getElementById('tabPedidos').classList.toggle('active', tab === 'pedidos');
  document.getElementById('tabStock').classList.toggle('active', tab === 'stock');
  document.getElementById('panelClientes').style.display = tab === 'clientes' ? 'block' : 'none';
  document.getElementById('panelPedidos').style.display = tab === 'pedidos' ? 'block' : 'none';
  document.getElementById('panelStock').style.display = tab === 'stock' ? 'block' : 'none';
  document.getElementById('tabVendedores').classList.toggle('active', tab === 'vendedores');
  document.getElementById('panelVendedores').style.display = tab === 'vendedores' ? 'block' : 'none';
  if (tab === 'vendedores') loadVendedores();
  if (tab === 'clientes') loadClientes();
  if (tab === 'pedidos') carregarVendedores().catch(() => []).then(loadPedidos);
  if (tab === 'stock') loadStockAdmin();
}

// ---------- Vendedores ----------
let vendedores = [];
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function carregarVendedores() {
  return db.collection('vendedores_b2b').orderBy('nome').get().then(snap => {
    vendedores = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    return vendedores;
  });
}
function nomeVendedor(id) { const v = vendedores.find(x => x.id === id); return v ? v.nome + ' (' + v.zona + ')' : 'Sem vendedor'; }
function opcoesVendedor(sel) {
  return '<option value="">— Sem vendedor —</option>' + vendedores.map(v =>
    `<option value="${v.id}" ${v.id === sel ? 'selected' : ''}>${esc(v.nome)} — ${esc(v.zona)}</option>`).join('');
}

function loadVendedores() {
  const el = document.getElementById('panelVendedores');
  el.innerHTML = '<div class="empty-state">A carregar...</div>';
  carregarVendedores().then(() => {
    el.innerHTML = `
      <div class="entry-card">
        <div class="entry-title" style="margin-bottom:10px;">Novo vendedor</div>
        <div class="form-grid">
          <input type="text" id="vNome" placeholder="Nome">
          <select id="vZona"><option>Norte</option><option>Centro</option><option>Sul</option></select>
          <input type="email" id="vEmail" placeholder="E-mail (recebe as encomendas)">
        </div>
        <div class="entry-actions"><button class="btn primary" onclick="criarVendedor()">Adicionar vendedor</button></div>
      </div>` + (vendedores.length ? vendedores.map(v => `
      <div class="entry-card">
        <div class="entry-top">
          <div><div class="entry-title">${esc(v.nome)}</div><div class="entry-sub">Zona ${esc(v.zona)} · ${esc(v.email)}</div></div>
          <button class="btn" onclick="apagarVendedor('${v.id}')">Remover</button>
        </div>
      </div>`).join('') : '<div class="empty-state">Ainda não há vendedores.</div>');
  });
}
function criarVendedor() {
  const nome = document.getElementById('vNome').value.trim();
  const zona = document.getElementById('vZona').value;
  const email = document.getElementById('vEmail').value.trim();
  if (!nome || !email) { alert('Preencha o nome e o e-mail do vendedor.'); return; }
  db.collection('vendedores_b2b').add({ nome, zona, email }).then(loadVendedores);
}
function apagarVendedor(id) {
  if (!confirm('Remover este vendedor? Os clientes dele ficam sem vendedor atribuído.')) return;
  db.collection('vendedores_b2b').doc(id).delete().then(loadVendedores);
}

// ---------- Clientes ----------
const PAGAMENTOS = { cheque30: 'Cheque a 30 dias', pronto: 'Pronto pagamento' };

function formNovoCliente() {
  return `
    <div class="entry-card" id="novoClienteCard">
      <div class="entry-title" style="margin-bottom:10px;">Novo cliente</div>
      <div class="auth-error" id="ncErro"></div>
      <div class="form-grid">
        <input type="text" id="ncFaturacao" placeholder="Nome de faturação (ex.: Viel &amp; Oliveira Pinto, Lda)">
        <input type="text" id="ncComercial" placeholder="Nome comercial (ex.: Centro Veterinário Linda-a-Velha)">
        <input type="text" id="ncNif" placeholder="NIF">
        <input type="text" id="ncContacto" placeholder="Pessoa de contacto">
        <input type="tel" id="ncTelefone" placeholder="Telefone">
        <input type="email" id="ncEmail" placeholder="E-mail de acesso do cliente">
        <input type="text" id="ncMoradaFat" placeholder="Morada de faturação">
        <input type="text" id="ncMoradaEnt" placeholder="Morada de entrega (vazio = igual à de faturação)">
        <input type="text" id="ncLocalidade" placeholder="Localidade (aparece no site, ex.: Linda-a-Velha)">
        <select id="ncVendedor">${opcoesVendedor('')}</select>
        <span style="display:flex; align-items:center; gap:6px;"><label style="font-size:0.85rem; color:var(--gray);">Desconto fixo:</label><input type="number" id="ncDesconto" value="0" min="0" max="100" style="width:70px;"> %</span>
      </div>
      <div style="display:flex; gap:16px; margin:10px 0; font-size:0.9rem;">
        <label><input type="checkbox" id="ncPagCheque" checked> Cheque a 30 dias</label>
        <label><input type="checkbox" id="ncPagPronto" checked> Pronto pagamento</label>
      </div>
      <div class="entry-actions"><button class="btn primary" id="ncBtn" onclick="criarCliente()">Criar cliente e enviar convite</button></div>
      <p style="font-size:0.8rem; color:var(--gray); margin-top:8px;">O cliente recebe um e-mail para definir a própria palavra-passe.</p>
    </div>`;
}

function loadClientes() {
  const el = document.getElementById('panelClientes');
  el.innerHTML = '<div class="empty-state">A carregar...</div>';
  carregarVendedores().catch(() => []).then(() => db.collection('lojas_publicas').get()).then(ps => { publicas = {}; ps.forEach(d => { publicas[d.id] = d.data(); }); }).then(() => db.collection('clientes_b2b').orderBy('criadoEm', 'desc').get()).then(snap => {
    const lista = snap.empty ? '<div class="empty-state">Ainda não há clientes.</div>' : snap.docs.map(doc => {
      const c = doc.data(), id = doc.id;
      const pags = c.pagamentos || ['cheque30', 'pronto'];
      return `
        <div class="entry-card">
          <div class="entry-top">
            <div>
              <div class="entry-title">${esc(c.nomeComercial || c.empresa)}</div>
              <div class="entry-sub">${esc(c.nomeFaturacao || '')}${c.nomeFaturacao ? ' · ' : ''}NIF: ${esc(c.nif)}</div>
              <div class="entry-sub">${esc(c.contacto)} · ${esc(c.email)} · ${esc(c.telefone)}</div>
              <div class="entry-sub">Faturação: ${esc(c.moradaFaturacao || c.morada)}</div>
              <div class="entry-sub">Entrega: ${esc(c.moradaEntrega || c.moradaFaturacao || c.morada)}</div>
            </div>
            <span class="badge ${c.aprovado ? 'aprovado' : 'pendente'}">${c.aprovado ? 'Ativo' : 'Inativo'}</span>
          </div>
          <div class="entry-actions" style="align-items:center; flex-wrap:wrap;">
            <select id="vend-${id}">${opcoesVendedor(c.vendedorId || '')}</select>
            <span style="display:flex; align-items:center; gap:6px;"><label style="font-size:0.85rem; color:var(--gray);">Desconto:</label><input type="number" id="desc-${id}" value="${c.desconto || 0}" min="0" max="100" style="width:64px;"> %</span>
            <label style="font-size:0.85rem;"><input type="checkbox" id="pc-${id}" ${pags.includes('cheque30') ? 'checked' : ''}> Cheque 30 dias</label>
            <label style="font-size:0.85rem;"><input type="checkbox" id="pp-${id}" ${pags.includes('pronto') ? 'checked' : ''}> Pronto pagamento</label>
            <button class="btn primary" onclick="guardarCliente('${id}')">Guardar</button>
          </div>
          <div class="entry-actions">
            ${c.aprovado
              ? `<button class="btn" onclick="setAprovado('${id}', false)">Desativar acesso</button>`
              : `<button class="btn primary" onclick="setAprovado('${id}', true)">Ativar acesso</button>`}
            <button class="btn" onclick="reenviarConvite('${esc(c.email)}')">Reenviar e-mail de palavra-passe</button>
          </div>
          <div class="montra-box">
            <div class="montra-foto">${publicas[id] && publicas[id].foto ? `<img src="${publicas[id].foto}" alt="">` : '<span>Sem foto</span>'}</div>
            <div style="flex:1; min-width:220px;">
              <div style="font-weight:600; margin-bottom:6px;">Montra no site (lojas parceiras)</div>
              <input type="text" id="loc-${id}" value="${esc(c.localidade || '')}" placeholder="Localidade" style="width:100%; margin-bottom:6px;">
              <input type="file" id="foto-${id}" accept="image/*" style="margin-bottom:6px;">
              <label style="display:block; font-size:0.85rem; margin-bottom:6px;"><input type="checkbox" id="pub-${id}" ${publicas[id] ? 'checked' : ''}> Mostrar esta loja no site</label>
              <button class="btn primary" onclick="guardarMontra('${id}')">Guardar montra</button>
            </div>
          </div>
        </div>`;
    }).join('');
    el.innerHTML = formNovoCliente() + lista;
  }).catch(err => { el.innerHTML = '<div class="empty-state">Erro ao carregar clientes.</div>'; console.error(err); });
}

let publicas = {};
function reduzirFoto(file) {
  return new Promise((ok, falha) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 900, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = falha; img.src = url;
  });
}
async function guardarMontra(id) {
  try {
    const doc = await db.collection('clientes_b2b').doc(id).get(); const c = doc.data();
    const localidade = document.getElementById('loc-' + id).value.trim();
    const mostrar = document.getElementById('pub-' + id).checked;
    const ficheiro = document.getElementById('foto-' + id).files[0];
    const foto = ficheiro ? await reduzirFoto(ficheiro) : (publicas[id] && publicas[id].foto) || '';
    await db.collection('clientes_b2b').doc(id).update({ localidade });
    if (mostrar) {
      if (!foto) { alert('Escolha uma foto da fachada antes de mostrar a loja no site.'); return; }
      const v = vendedores.find(x => x.id === c.vendedorId);
      await db.collection('lojas_publicas').doc(id).set({ nome: c.nomeComercial || c.empresa, localidade, zona: v ? v.zona : 'Outras', foto });
    } else {
      await db.collection('lojas_publicas').doc(id).delete();
    }
    alert(mostrar ? 'Loja visível no site.' : 'Loja retirada do site.');
    loadClientes();
  } catch (e) { alert('Não foi possível guardar: ' + (e.message || e)); }
}

function lerPagamentos(chequeId, prontoId) {
  const p = [];
  if (document.getElementById(chequeId).checked) p.push('cheque30');
  if (document.getElementById(prontoId).checked) p.push('pronto');
  return p;
}

function senhaAleatoria() {
  const a = new Uint32Array(6); crypto.getRandomValues(a);
  return Array.from(a, n => n.toString(36)).join('') + 'Aa1!';
}

async function criarCliente() {
  const v = id => document.getElementById(id).value.trim();
  const erro = document.getElementById('ncErro'); erro.classList.remove('show');
  const dados = {
    nomeFaturacao: v('ncFaturacao'), nomeComercial: v('ncComercial'), nif: v('ncNif'),
    contacto: v('ncContacto'), telefone: v('ncTelefone'), email: v('ncEmail').toLowerCase(),
    localidade: v('ncLocalidade'), moradaFaturacao: v('ncMoradaFat'), moradaEntrega: v('ncMoradaEnt') || v('ncMoradaFat'),
    vendedorId: v('ncVendedor'), desconto: parseFloat(v('ncDesconto') || '0') || 0,
    pagamentos: lerPagamentos('ncPagCheque', 'ncPagPronto')
  };
  const falta = !dados.nomeFaturacao || !dados.nomeComercial || !dados.nif || !dados.email || !dados.moradaFaturacao;
  if (falta) { erro.textContent = 'Preencha pelo menos nome de faturação, nome comercial, NIF, e-mail e morada de faturação.'; erro.classList.add('show'); return; }
  if (!dados.pagamentos.length) { erro.textContent = 'Escolha pelo menos uma forma de pagamento.'; erro.classList.add('show'); return; }
  const btn = document.getElementById('ncBtn'); btn.disabled = true; btn.textContent = 'A criar...';
  const sec = firebase.apps.find(a => a.name === 'convites') || firebase.initializeApp(firebaseConfig, 'convites');
  const secAuth = sec.auth(); secAuth.languageCode = 'pt';
  try {
    const cred = await secAuth.createUserWithEmailAndPassword(dados.email, senhaAleatoria());
    await db.collection('clientes_b2b').doc(cred.user.uid).set({
      ...dados, empresa: dados.nomeComercial, morada: dados.moradaFaturacao, aprovado: true,
      criadoEm: firebase.firestore.FieldValue.serverTimestamp()
    });
    await secAuth.sendPasswordResetEmail(dados.email);
    await secAuth.signOut();
    alert('Cliente criado. Foi enviado um e-mail para ' + dados.email + ' definir a palavra-passe.');
    loadClientes();
  } catch (err) {
    const msgs = { 'auth/email-already-in-use': 'Já existe uma conta com este e-mail.', 'auth/invalid-email': 'E-mail inválido.' };
    erro.textContent = msgs[err.code] || ('Não foi possível criar o cliente: ' + (err.message || err));
    erro.classList.add('show');
    btn.disabled = false; btn.textContent = 'Criar cliente e enviar convite';
  }
}

function guardarCliente(id) {
  const pagamentos = lerPagamentos('pc-' + id, 'pp-' + id);
  if (!pagamentos.length) { alert('Escolha pelo menos uma forma de pagamento.'); return; }
  db.collection('clientes_b2b').doc(id).update({
    vendedorId: document.getElementById('vend-' + id).value,
    desconto: parseFloat(document.getElementById('desc-' + id).value || '0') || 0,
    pagamentos
  }).then(() => alert('Cliente guardado.'));
}

function setAprovado(uid, aprovado) {
  db.collection('clientes_b2b').doc(uid).update({ aprovado }).then(loadClientes);
}

function reenviarConvite(email) {
  auth.languageCode = 'pt';
  auth.sendPasswordResetEmail(email).then(() => alert('E-mail enviado para ' + email));
}

// ---------- Encomendas ----------
let allPedidos = [];

// ---------- Verificação de preços, stock e exportação ----------
let pedidosClientes = {}, pedidosPrecos = {};
function chaveItem(it) {
  if (it.key) {
    const pid = it.key.split('_')[0], lab = it.key.split('_').slice(1).join('_');
    const p = produtos.find(x => String(x.id) === pid), t = p && p.tamanhos.find(x => x.label === lab);
    if (t) return { key: it.key, p, t };
  }
  const p = produtos.find(x => x.nome === it.nome), t = p && p.tamanhos.find(x => x.label === it.tamanho);
  return t ? { key: p.id + '_' + t.label, p, t } : null;
}
function precoOficial(it) {
  const c = chaveItem(it); if (!c) return null;
  return pedidosPrecos[c.key] !== undefined ? pedidosPrecos[c.key] : c.t.preco;
}
function totaisOficiais(p) {
  const c = pedidosClientes[p.clienteUid] || {};
  const desconto = c.desconto != null ? c.desconto : (p.desconto || 0);
  let subtotal = 0, desconhecido = false;
  (p.itens || []).forEach(it => { const pr = precoOficial(it); if (pr == null) { desconhecido = true; subtotal += (it.preco || 0) * it.qty; } else subtotal += pr * it.qty; });
  subtotal = Math.round(subtotal * 100) / 100;
  const valorDesconto = Math.round(subtotal * desconto) / 100;
  const total = Math.round((subtotal - valorDesconto) * 100) / 100;
  return { subtotal, desconto, valorDesconto, total, iva: Math.round(total * 23) / 100, comIva: Math.round(total * 123) / 100, diferente: Math.abs(total - (p.total || 0)) > 0.01, desconhecido };
}
function carregarRefsPedidos() {
  return Promise.all([db.collection('clientes_b2b').get(), db.collection('precos_b2b').get().catch(() => null)]).then(([cs, ps]) => {
    pedidosClientes = {}; cs.forEach(d => { pedidosClientes[d.id] = d.data(); });
    pedidosPrecos = {}; if (ps) ps.forEach(d => { pedidosPrecos[d.id] = d.data().preco; });
  });
}
function exportarCSV(nome, linhas) {
  const csv = '\ufeff' + linhas.map(l => l.map(v => { const s = String(v == null ? '' : v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = nome + '-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}
const numPT = v => (Math.round((v || 0) * 100) / 100).toFixed(2).replace('.', ',');
async function exportarClientes() {
  try {
    await carregarVendedores().catch(() => []);
    const s = await db.collection('clientes_b2b').get();
    const L = [['Nome comercial', 'Nome de faturação', 'NIF', 'Contacto', 'Telefone', 'E-mail', 'Morada de faturação', 'Morada de entrega', 'Localidade', 'Vendedor', 'Desconto %', 'Pagamentos', 'Ativo']];
    s.forEach(d => { const c = d.data(); L.push([c.nomeComercial || c.empresa, c.nomeFaturacao, c.nif, c.contacto, c.telefone, c.email, c.moradaFaturacao || c.morada, c.moradaEntrega, c.localidade, c.vendedorId ? nomeVendedor(c.vendedorId) : '', numPT(c.desconto), (c.pagamentos || ['cheque30', 'pronto']).map(x => x === 'cheque30' ? 'Cheque 30 dias' : 'Pronto pagamento').join(', '), c.aprovado ? 'Sim' : 'Não']); });
    exportarCSV('clientes-ibernop', L);
  } catch (e) { alert('Não foi possível exportar: ' + e.message); }
}
async function exportarEncomendas() {
  try {
    await carregarVendedores().catch(() => []);
    await carregarRefsPedidos();
    const s = await db.collection('pedidos_b2b').orderBy('criadoEm', 'desc').get();
    const L = [['Data', 'Ref.', 'Estado', 'Cliente', 'Nome de faturação', 'NIF', 'Vendedor', 'Pagamento', 'Código', 'EAN', 'Produto', 'Tamanho', 'Qtd', 'Preço s/ IVA', 'Total linha s/ IVA', 'Desconto %', 'Total encomenda s/ IVA', 'IVA 23%', 'Total encomenda c/ IVA']];
    s.forEach(d => {
      const p = { id: d.id, ...d.data() }, o = totaisOficiais(p);
      const data = p.criadoEm && p.criadoEm.toDate ? p.criadoEm.toDate().toLocaleString('pt-PT') : '';
      (p.itens || []).forEach(it => {
        const c = chaveItem(it), pr = precoOficial(it); const preco = pr == null ? it.preco : pr;
        L.push([data, p.id.slice(-6).toUpperCase(), p.estado, p.empresa, p.nomeFaturacao, p.nif, p.vendedorId ? nomeVendedor(p.vendedorId) : '', p.metodoPagamento === 'cheque30' ? 'Cheque 30 dias' : 'Pronto pagamento', c ? c.t.cod : '', c ? c.t.ean : '', it.nome, it.tamanho, it.qty, numPT(preco), numPT(preco * it.qty), numPT(o.desconto), numPT(o.total), numPT(o.iva), numPT(o.comIva)]);
      });
    });
    exportarCSV('encomendas-ibernop', L);
  } catch (e) { alert('Não foi possível exportar: ' + e.message); }
}
function mexerStock(p, sinal) {
  const mapa = {};
  (p.itens || []).forEach(it => { const c = chaveItem(it); if (c) mapa[c.key] = { qty: (mapa[c.key] ? mapa[c.key].qty : 0) + it.qty, inicial: c.t.stock || 0 }; });
  const keys = Object.keys(mapa); if (!keys.length) return Promise.resolve();
  return db.runTransaction(tx => {
    const refs = keys.map(k => db.collection('estoque_b2b').doc(k));
    return Promise.all(refs.map(r => tx.get(r))).then(snaps => {
      snaps.forEach((snap, i) => {
        const m = mapa[keys[i]]; const atual = snap.exists ? snap.data().qty : m.inicial;
        tx.set(refs[i], { qty: Math.max(0, atual + sinal * m.qty) }, { merge: true });
      });
    });
  });
}

function loadPedidos() {
  const el = document.getElementById('panelPedidos');
  el.innerHTML = '<div class="empty-state">A carregar...</div>';
  carregarRefsPedidos().then(() => db.collection('pedidos_b2b').orderBy('criadoEm', 'desc').get()).then(snap => {
    if (snap.empty) { el.innerHTML = '<div class="empty-state">Ainda não há encomendas.</div>'; return; }
    allPedidos = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    el.innerHTML = allPedidos.map(p => {
      const itensHtml = (p.itens || []).map(it => { const pr = precoOficial(it); return `${it.qty}x ${esc(it.nome)} (${esc(it.tamanho)}) — ${((pr == null ? it.preco : pr) * it.qty).toFixed(2)}€`; }).join('<br>');
      const metodoLabel = p.metodoPagamento === 'cheque30' ? 'Cheque a 30 dias' : 'Pronto pagamento';
      let actions = '';
      if (p.estado === 'pendente') actions = `<button class="btn primary" onclick="setEstadoPedido('${p.id}','separado')">Marcar como separado</button>`;
      else if (p.estado === 'separado') actions = `<button class="btn primary" onclick="setEstadoPedido('${p.id}','enviado')">Marcar como enviado</button> <button class="btn" onclick="setEstadoPedido('${p.id}','pendente')">Voltar a pendente</button>`;
      else actions = `<button class="btn" onclick="setEstadoPedido('${p.id}','separado')">Reabrir</button>`;
      return `
        <div class="entry-card">
          <div class="entry-top">
            <div>
              <div class="entry-title">${p.empresa}</div>
              <div class="entry-sub">${p.nomeFaturacao ? esc(p.nomeFaturacao) + ' · ' : ''}NIF: ${p.nif} · ${metodoLabel}${p.vendedorId ? ' · Vendedor: ' + esc(nomeVendedor(p.vendedorId)) : ''}</div>
              ${p.moradaEntrega ? `<div class="entry-sub">Entrega: ${esc(p.moradaEntrega)}</div>` : ''}
              ${(() => { const o = totaisOficiais(p); return `<div class="entry-sub">Subtotal: ${o.subtotal.toFixed(2)}€${o.desconto ? ` · Desconto (${o.desconto}%): -${o.valorDesconto.toFixed(2)}€` : ''} · <strong>Total s/ IVA: ${o.total.toFixed(2)}€</strong> · IVA 23%: ${o.iva.toFixed(2)}€ · <strong>c/ IVA: ${o.comIva.toFixed(2)}€</strong></div>` + (o.diferente ? `<div class="entry-sub" style="color:var(--red);font-weight:700">Atenção: valores recalculados pela tabela atual e pelo desconto da ficha. O cliente enviou ${(p.total || 0).toFixed(2)}€ s/ IVA. Confirme antes de faturar.</div>` : '') + (o.desconhecido ? `<div class="entry-sub" style="color:var(--red)">Há produtos que já não estão na tabela; foi usado o preço enviado.</div>` : ''); })()}
            </div>
            <span class="badge ${p.estado}">${p.estado}</span>
          </div>
          <div class="itens-list">${itensHtml}</div>
          <div class="entry-actions">
            <button class="btn" style="background:var(--charcoal); color:#fff; border-color:var(--charcoal);" onclick="abrirListaSeparacao('${p.id}')">📋 Lista de separação</button>
            ${actions}
          </div>
        </div>`;
    }).join('');
  });
}

function setEstadoPedido(id, estado) {
  // O stock desce quando a encomenda é marcada como separada (e repõe se voltar a pendente)
  const p = allPedidos.find(x => x.id === id);
  const sinal = p && p.estado === 'pendente' && estado === 'separado' ? -1 : (p && p.estado === 'separado' && estado === 'pendente' ? 1 : 0);
  (sinal ? mexerStock(p, sinal) : Promise.resolve())
    .then(() => db.collection('pedidos_b2b').doc(id).update({ estado }))
    .then(loadPedidos)
    .catch(e => alert('Não foi possível atualizar: ' + e.message));
}

// ---------- Stock ----------
let liveStockAdmin = {}; // vindo do Firestore
let precosAdmin = {}; // preços alterados na Gestão (sem IVA)

function loadStockAdmin() {
  document.getElementById('stockList').innerHTML = '<div class="empty-state">A carregar...</div>';
  db.collection('precos_b2b').get().then(ps => { precosAdmin = {}; ps.forEach(d => { precosAdmin[d.id] = d.data().preco; }); }).catch(() => {}).then(() => db.collection('estoque_b2b').get()).then(snap => {
    liveStockAdmin = {};
    snap.forEach(doc => { liveStockAdmin[doc.id] = doc.data().qty; });
    renderStockList();
  }).catch(err => {
    document.getElementById('stockList').innerHTML = '<div class="empty-state">Erro ao carregar stock.</div>';
    console.error(err);
  });
}

function renderStockList() {
  const termo = (document.getElementById('stockSearch').value || '').toLowerCase();
  const el = document.getElementById('stockList');
  const linhas = [];
  produtos.forEach(p => {
    if (termo && !p.nome.toLowerCase().includes(termo)) return;
    p.tamanhos.forEach(t => {
      const key = `${p.id}_${t.label}`;
      const qty = liveStockAdmin[key] !== undefined ? liveStockAdmin[key] : t.stock;
      const preco = precosAdmin[key] !== undefined ? precosAdmin[key] : t.preco;
      linhas.push({ key, nome: p.nome, tamanho: t.label, qty, preco, alterado: precosAdmin[key] !== undefined });
    });
  });
  if (linhas.length === 0) { el.innerHTML = '<div class="empty-state">Sem resultados.</div>'; return; }
  el.innerHTML = linhas.map(l => `
    <div class="entry-card" style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 18px;">
      <div><strong>${l.nome}</strong> <span style="color:var(--gray);">— ${l.tamanho}</span></div>
      <div style="display:flex; align-items:center; gap:8px;">
        <label style="font-size:.78rem;color:var(--gray)">Preço s/ IVA €</label>
        <input type="number" id="preco-${l.key}" value="${l.preco}" min="0" step="0.01" style="width:90px;${l.alterado ? 'border-color:var(--gold)' : ''}">
        <label style="font-size:.78rem;color:var(--gray)">Stock</label>
        <input type="number" id="stock-${l.key}" value="${l.qty}" min="0" style="width:70px;">
        <button class="btn primary" onclick="guardarStock('${l.key}')">Guardar</button>
      </div>
    </div>`).join('');
}

function guardarStock(key) {
  const val = parseInt(document.getElementById(`stock-${key}`).value || '0', 10);
  const preco = Math.round(parseFloat(document.getElementById(`preco-${key}`).value || '0') * 100) / 100;
  Promise.all([
    db.collection('estoque_b2b').doc(key).set({ qty: val }, { merge: true }),
    db.collection('precos_b2b').doc(key).set({ preco })
  ]).then(() => { liveStockAdmin[key] = val; precosAdmin[key] = preco; alert('Guardado: ' + preco.toFixed(2) + '€ s/ IVA · stock ' + val); })
    .catch(e => alert('Não foi possível guardar: ' + e.message));
}

// ---------- Lista de separação ----------
function abrirListaSeparacao(id) {
  const p = allPedidos.find(x => x.id === id);
  if (!p) return;
  document.getElementById('separacaoCliente').textContent = `${p.empresa} · Pedido ${id.slice(-6).toUpperCase()}`;
  document.getElementById('separacaoLista').innerHTML = (p.itens || []).map((it, i) => `
    <label class="separacao-item" id="sep-item-${i}">
      <input type="checkbox" onchange="document.getElementById('sep-item-${i}').classList.toggle('riscado', this.checked)">
      <span class="separacao-qty">${it.qty}x</span>
      <span><span class="separacao-nome">${it.nome}</span> <span class="separacao-tamanho">— ${it.tamanho}</span></span>
    </label>`).join('');
  document.getElementById('separacaoBackdrop').classList.add('open');
  document.getElementById('separacaoModal').classList.add('open');
}

function fecharListaSeparacao() {
  document.getElementById('separacaoBackdrop').classList.remove('open');
  document.getElementById('separacaoModal').classList.remove('open');
}
</script>
