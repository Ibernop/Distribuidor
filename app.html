<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px 22px;background:radial-gradient(circle at 50% 0%,#0f3a52 0%,#07202e 60%);color:#fff;font-family:Montserrat,system-ui,sans-serif;text-align:center}
.logo{width:150px;height:150px;border-radius:32px;background:url(icon-512.png) center/cover;box-shadow:0 18px 40px rgba(0,0,0,.35)}
h1{font-size:1.5rem;font-weight:800;letter-spacing:.04em}
p{opacity:.75;font-size:.95rem;margin-top:6px}
.op{display:flex;flex-direction:column;gap:14px;width:100%;max-width:360px}
a{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:18px;text-decoration:none;color:#07202e;background:#fff;font-weight:700;font-size:1.05rem;text-align:left;box-shadow:0 10px 26px rgba(0,0,0,.25);transition:transform .15s}
a:active{transform:scale(.98)}
a small{display:block;font-weight:500;font-size:.8rem;color:#5a6a74;margin-top:2px}
a.eq{background:#1b86f1;color:#fff}a.eq small{color:#dbeafe}
.ic{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#eef5fc;font-size:1.4rem}
a.eq .ic{background:rgba(255,255,255,.18)}
</style>
<meta name="description" content="Faça as suas encomendas Ibernop online: lojas e clínicas parceiras.">
<meta property="og:type" content="website"><meta property="og:site_name" content="Ibernop"><meta property="og:title" content="Ibernop | Área de Cliente"><meta property="og:description" content="Faça as suas encomendas Ibernop online: lojas e clínicas parceiras."><meta property="og:url" content="https://ibernop.pt/app.html"><meta property="og:image" content="https://ibernop.pt/icon-512.png"><meta property="og:locale" content="pt_PT"><meta name="twitter:card" content="summary"><link rel="canonical" href="https://ibernop.pt/app.html">
</head>
<body>
<div class="logo" role="img" aria-label="Ibernop"></div>
<div><h1>IBERNOP</h1><p>Produtos para animais</p></div>
<div class="op">
  <a href="loja.html"><span class="ic">🛒</span><span>Área de Cliente<small>Fazer encomendas e incidências</small></span></a>
  <a class="eq" href="admin.html"><span class="ic">💼</span><span>Gestão de equipa<small>Administração e gestores de zona</small></span></a>
</div>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
<div id="appInst" hidden style="position:fixed;right:14px;bottom:14px;z-index:9999;max-width:290px;font-family:inherit"><div id="appDica" hidden style="background:#fff;color:#07202e;border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:.85rem;line-height:1.4">No iPhone: toque em <b>Partilhar</b> (o quadrado com a seta) e depois em <b>Adicionar ao ecrã principal</b>.</div><button id="appBtn" type="button" style="display:flex;align-items:center;gap:8px;margin-left:auto;background:#07202e;color:#fff;border:0;border-radius:999px;padding:11px 18px;font-family:inherit;font-weight:600;font-size:.9rem;line-height:1;box-shadow:0 10px 30px rgba(0,0,0,.3);cursor:pointer">📲 Instalar app <span id="appX" style="opacity:.6;margin-left:4px">✕</span></button></div>
<script>
(function () {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  const box = document.getElementById('appInst'), btn = document.getElementById('appBtn'), dica = document.getElementById('appDica');
  const instalada = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  let fechado = false; try { fechado = localStorage.getItem('appInstFechado') === '1'; } catch (e) {}
  if (instalada || fechado) return;
  let pedido = null;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); pedido = e; box.hidden = false; });
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (ios) box.hidden = false;
  btn.addEventListener('click', e => {
    if (e.target.id === 'appX') { box.hidden = true; try { localStorage.setItem('appInstFechado', '1'); } catch (x) {} return; }
    if (pedido) { pedido.prompt(); pedido.userChoice.then(() => { box.hidden = true; pedido = null; }); }
    else if (ios) dica.hidden = !dica.hidden;
  });
  addEventListener('appinstalled', () => { box.hidden = true; });
})();
</script>
